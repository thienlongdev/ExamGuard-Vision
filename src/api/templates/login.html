<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — ExamGuard Vision</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--color-bg-primary, #0b0f19);
      color: var(--color-text-primary, #f1f5f9);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: var(--color-panel-bg, #111827);
      border: 1px solid var(--color-border, #1e293b);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      width: 52px;
      height: 52px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-live, #10b981);
      margin-bottom: 14px;
    }
    .auth-brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--color-text-secondary, #94a3b8);
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-secondary, #cbd5e1);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--color-border, #334155);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--color-live, #10b981);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 11px 16px;
      background: var(--color-live, #10b981);
      color: #0b0f19;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .btn-submit:hover:not(:disabled) {
      background: #059669;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-error {
      display: none;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 6px;
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border, #1e293b);
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="3"/>
        </svg>
      </div>
      <h1>ExamGuard Vision</h1>
      <p>Hệ thống Giám sát Phòng thi & Bằng chứng AI</p>
    </div>

    <div class="auth-error" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input class="form-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span>Đăng nhập</span>
      </button>
    </form>

    <div class="auth-footer">
      ExamGuard Vision Production Foundation · Mã hóa AES-256-GCM · RBAC
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Đang xử lý...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = "/";
        } else if (res.status === 423) {
          const data = await res.json().catch(() => ({}));
          errorBox.textContent = data.detail || "Tài khoản tạm thời bị khóa. Vui lòng thử lại sau.";
          errorBox.style.display = "block";
        } else {
          const data = await res.json().catch(() => ({}));
          errorBox.textContent = data.detail || "Tên đăng nhập hoặc mật khẩu không đúng.";
          errorBox.style.display = "block";
        }
      } catch (err) {
        errorBox.textContent = "Lỗi kết nối máy chủ. Vui lòng kiểm tra lại dịch vụ.";
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Đăng nhập";
      }
    });
  </script>
</body>
</html>
