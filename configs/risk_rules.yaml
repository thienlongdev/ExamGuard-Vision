# Temporal Rules, Suspicion Scoring, and Alert Debounce Configuration

temporal_buffer:
  max_history_seconds: 300.0       # Retain up to 5 minutes of sliding window history per student
  eviction_inactive_seconds: 60.0  # Remove tracks inactive for >60s to prevent memory leaks

scoring:
  # Risk levels based on total score (0 to 100)
  thresholds:
    low: 25.0
    medium: 50.0
    high: 75.0

  # Severity score mappings
  severity_base_scores:
    low: 30.0
    medium: 60.0
    high: 85.0

debounce:
  cooldown_seconds: 10.0   # Suppress duplicate alerts for same student & event type within this window

rules:
  prolonged_phone_use:
    name: "Prolonged Cell Phone Usage"
    behavior: "use_phone"
    require_phone: true
    min_duration_seconds: 3.0
    window_seconds: 30.0
    severity: "high"
    score: 85.0
    description: "Student is actively interacting with or holding a cell phone for >= 3 seconds."

  repeated_turning:
    name: "Frequent Head Turning"
    behavior: "turn_head"
    min_occurrences: 5
    window_seconds: 60.0
    severity: "medium"
    score: 60.0
    description: "Student turned head >= 5 times within a 60 second window."

  discussion:
    name: "Active Discussion / Talking"
    behavior: "discuss"
    min_duration_seconds: 2.5
    window_seconds: 30.0
    severity: "medium"
    score: 65.0
    description: "Student engaged in discussion / communication for >= 2.5 seconds."

  standing_up:
    name: "Leaving Seat / Standing"
    behavior: "stand"
    min_duration_seconds: 3.0
    window_seconds: 30.0
    severity: "medium"
    score: 55.0
    description: "Student stood up from exam desk for >= 3 seconds."

  phone_and_head_down:
    name: "Concealed Phone Under Desk"
    behavior: "head_down"
    require_phone: true
    min_duration_seconds: 2.5
    window_seconds: 30.0
    severity: "high"
    score: 90.0
    description: "Cell phone detected in student vicinity while looking down continuously."

  prolonged_head_down:
    name: "Prolonged Head Down"
    behavior: "head_down"
    min_duration_seconds: 15.0
    window_seconds: 60.0
    severity: "low"
    score: 35.0
    description: "Student maintains head down position continuously for >= 15 seconds."
