# Candidate Dataset Class Mapping Configuration V3
# Strictly based on physically downloaded files, actual local class IDs, and visual verification.

canonical_taxonomy:
  0: normal
  1: head_down
  2: turn_head
  3: discuss
  4: stand

canonical_classes:
  - normal      # 0
  - head_down   # 1
  - turn_head   # 2
  - discuss     # 3
  - stand       # 4

omitted_classes:
  use_phone:
    reason: "Audits show existing datasets box phone devices or hands on desks rather than whole student posture. Section 29 fallback architecture active: handled via COCO cell phone detector + ByteTrack spatial association + temporal rules."
    status: OMITTED_FROM_BEHAVIOR_MODEL
  lean:
    reason: "No clean, visually verified physical annotations exist in downloaded datasets. Excluded to prevent label corruption."
    status: OMITTED_FROM_BEHAVIOR_MODEL

